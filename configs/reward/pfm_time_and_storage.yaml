# @package _global_

env:
    reward:
        completion_bonus: 0.0

        pfm:
            enabled: true
            burn_in_trajectories: 100
            completion_baseline: 10.0
            catastrophic_penalty: 0.0
            polyak_tau: 0.0005
            clip_bound: 5.0
            phi_optimism: 3.0
            objectives:
                - name: time
                  weight: 0.99
                  sigma_min: 5.0
                  direction: minimize
                  info_key: elapsed_time_hours
                - name: storage
                  weight: 0.01
                  sigma_min: 5.0
                  direction: minimize
                  info_key: cost/storage

        milestone:
            stage_weights:
                at_source: 0.0
                on_heavy_lift: 0.2
                at_staging: 0.4
                on_feeder: 0.6
                on_installer: 0.8
                at_goal: 1.0
            urgency_scale: 1.0
            urgency_mode: linear

        costs:
            weight: 1.0
            elapsed_time:
                enabled: true
                weight: 1.0
                rate: 1.0
            travel:
                enabled: false
            storage:
                enabled: true
                weight: 1.0
                rates:
                    marshalling_yard:
                        monopile: 0.01
