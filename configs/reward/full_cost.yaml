# @package _global_
#
# Reward: DPBRS milestone shaping + terminal cost evaluation (all cost components)
#
env:
    reward:
        completion_bonus: 50.0

        milestone:
            stage_weights:
                at_source: 0.0
                on_heavy_lift: 0.2
                at_staging: 0.4
                on_feeder: 0.6
                on_installer: 0.8
                at_goal: 1.0
            urgency_scale: 1.0
            urgency_mode: linear

        costs:
            weight: 1.0
            elapsed_time:
                enabled: true
                weight: 1.0
                rate: 0.085
            travel:
                enabled: true
                weight: 1.0
                rates:
                    HTV: 0.01
                    Barge: 0.1
                    installation_vessel: 0.025
            storage:
                enabled: true
                weight: 1.0
                rates:
                    marshalling_yard:
                        monopile: 5.0
                    fabrication_yard:
                        monopile: 1.0
