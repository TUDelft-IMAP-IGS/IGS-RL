defaults:
    - eos_schema
    - _self_
    - env: smt
    - learner: ppo
    - controller: ppo
    - model: transformer
    - method: ppo_transformer_joint
    - scenario: smt_basic_marshalling_early
    - reward: time_only
    - experiment: smt_basic__ppo_transformer__time_and_storage

# Global Defaults
exp_name: "ppo_transformer_smt_basic"
seed: 42
torch_deterministic: true
cuda: true
track: true
capture_video: false
total_timesteps: 1500000
num_envs: 16
num_steps: 512
normalize_rewards: true

debug: false
log_level: INFO
log_dir_level: ERROR
log_every_updates: 1
log_env_info: true
log_rollout_stats: true

checkpoint:
    enable: true
    eval_after_steps: 250_000
    metric: episodic_return_ema
    mode: max
    save_dir: outputs/checkpoints/

eval:
    enable: true
    num_episodes: 1
    deterministic: true
    capture_video: false # currently not working
    render_mode: null

tune:
    enable: false
    study_name: smt_ppo_tuning
    n_trials: 25
    storage: smt_tuning.db
